name: calender
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  android_intent_plus: ^6.0.0
  cached_network_image: ^4.0.4
  cloud_firestore: ^6.1.1
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.2.0
  dio: ^5.7.0
  dynamic_path_url_strategy: ^1.0.0
  easy_localization: ^3.0.7+1
  eraser: ^3.0.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_gemini:
    git:
      url: https://github.com/AkhmadRamadani/flutter_gemini.git
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^22.3.1
  flutter_native_timezone_latest: ^1.0.0
  flutter_riverpod: ^3.0.3
  flutter_slidable: ^4.0.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.17
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  hive_flutter: ^1.1.0
  home_widget: ^0.10.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  lottie: ^3.3.2
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  responsive_framework: ^1.5.1
  riverpod_annotation: ^4.0.0
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.12.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/fonts/Ar_Fonts/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic Black 900.otf
          weight: 900
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic ExtraBold 800.otf
          weight: 800
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic Bold 700.otf
          weight: 700
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic SemiBold 600.otf
          weight: 600
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic Medium 500.otf
          weight: 500
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic Regular 400.otf
          weight: 400
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic Light 300.otf
          weight: 300
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic ExtraLight 275.otf
          weight: 200
        - asset: assets/fonts/Ar_Fonts/Montserrat-Arabic Thin 250.otf
          weight: 100

    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_Bold_700.ttf
          weight: 700
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_SemiBold_600.ttf
          weight: 600
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_Medium_500.ttf
          weight: 500
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_Regular_400.ttf
          weight: 400
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_Light_300.ttf
          weight: 300
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_ExtraLight_275.ttf
          weight: 200
        - asset: assets/fonts/Ar_Fonts/IBMPlexSansArabic_Thin_250.ttf
          weight: 100

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
  # dart run flutter_launcher_icons    to generate app icons
  # An image asset can refer to one or more resolution-specific "variants", see
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
